<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>JSON Download</title>
</head>
<body>

<script>
  fetch('./ai_character_bottomsheet.json')
    .then(response => response.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.href = url;
      a.download = 'ai_character_bottomsheet.json';

      document.body.appendChild(a);
      a.click();

      a.remove();
      URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
